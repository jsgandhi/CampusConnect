version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_password
      POSTGRES_DB: campusconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campusconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
